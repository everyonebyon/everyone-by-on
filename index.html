<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Productos</title>
    <!-- Favicon de la tienda -->
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1d_y7B5OLrkzGpgYtwH8Tg0yzJWw1rpNk">
    <style>
        :root {
            --primary-color: #4CBB17;
            --dark-color: #111111;
            --gray-light: #f9f9f9;
            --border-color: #eaeaea;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: var(--dark-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            padding: 15px 40px;
            border-bottom: 1px solid var(--border-color);
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            position: sticky;
            top: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(5px);
            z-index: 100;
        }
        /* Espacio izquierdo reservado para equilibrio visual */
        header::before {
            content: "";
            grid-column: 1;
        }
        .brand-container {
            grid-column: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            text-align: center;
        }
        .brand-logo {
            height: 50px; /* Logo más grande y elegante */
            max-width: 160px;
            object-fit: contain;
        }
        header h1 {
            font-size: 20px;
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.5px;
            white-space: nowrap;
        }
        .header-actions {
            grid-column: 3;
            display: flex;
            justify-content: flex-end;
        }
        .btn-carrito {
            background-color: var(--dark-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }
        .btn-carrito:hover {
            background-color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            flex: 1;
            width: 100%;
            box-sizing: border-box;
        }
        .hero {
            margin-bottom: 25px;
        }
        .hero h2 {
            font-size: 26px;
            font-weight: 700;
            margin: 0 0 6px 0;
        }
        .hero p {
            color: #666;
            font-size: 14px;
            margin: 0;
        }

        /* Controles de Búsqueda y Categorías */
        .store-controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }
        @media(min-width: 768px) {
            .store-controls {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }
        .search-box {
            position: relative;
            flex: 1;
            max-width: 400px;
        }
        .search-box input {
            width: 100%;
            padding: 10px 15px 10px 40px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        .search-box input:focus {
            border-color: var(--dark-color);
        }
        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
            font-size: 14px;
        }
        .categories-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 5px;
        }
        .btn-cat {
            background: var(--gray-light);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .btn-cat:hover {
            background: #eee;
        }
        .btn-cat.active {
            background: var(--dark-color);
            color: white;
            border-color: var(--dark-color);
        }

        /* Rejilla de productos */
        .grid-productos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 25px;
        }
        .card {
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            background: #fff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.04);
        }
        .card-img-container {
            width: 100%;
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 8px;
            background: var(--gray-light);
            margin-bottom: 15px;
        }
        .card img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .card h3 {
            font-size: 15px;
            font-weight: 600;
            margin: 0 0 6px 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card p {
            font-size: 12px;
            color: #666;
            margin: 0 0 15px 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.4;
        }
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }
        .price {
            font-size: 16px;
            font-weight: 700;
        }
        .btn-agregar {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-agregar:hover {
            background-color: #3fa512;
        }
        .btn-agregado {
            background-color: var(--dark-color);
        }

        /* Carrito Drawer */
        .cart-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(2px);
            display: none;
            z-index: 1000;
        }
        .cart-drawer {
            position: fixed;
            top: 0; right: -400px; width: 380px; max-width: 100%; height: 100%;
            background: white;
            box-shadow: -5px 0 25px rgba(0,0,0,0.1);
            z-index: 1001;
            display: flex;
            flex-direction: column;
            transition: right 0.3s ease;
        }
        .cart-drawer.open { right: 0; }
        .cart-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center;
        }
        .cart-header h3 { margin: 0; font-size: 16px; }
        .btn-cerrar { background: none; border: none; font-size: 20px; cursor: pointer; }
        .cart-body { padding: 20px; flex: 1; overflow-y: auto; }
        .cart-item {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid var(--border-color);
        }
        .cart-item-info h4 { margin: 0 0 4px 0; font-size: 13px; }
        .cart-item-info p { margin: 0; font-size: 12px; color: #666; }
        .cart-controls { display: flex; align-items: center; gap: 8px; }
        .btn-qty {
            background: #f1f1f1; border: none; width: 24px; height: 24px;
            border-radius: 4px; font-weight: bold; cursor: pointer;
        }
        .cart-footer { padding: 20px; border-top: 1px solid var(--border-color); background: var(--gray-light); }
        .cart-total { display: flex; justify-content: space-between; font-size: 16px; font-weight: 700; margin-bottom: 15px; }
        .btn-whatsapp {
            width: 100%; background-color: #25D366; color: white; border: none;
            padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 600;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            gap: 8px; text-decoration: none; transition: background 0.2s;
        }
        .btn-whatsapp:hover { background-color: #1ebe57; }

        /* Pie de página elegante */
        footer {
            border-top: 1px solid var(--border-color);
            padding: 40px 20px;
            background: #fafafa;
            margin-top: auto;
        }
        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            text-align: center;
        }
        @media(min-width: 768px) {
            .footer-content {
                flex-direction: row;
                justify-content: space-between;
                text-align: left;
            }
        }
        .footer-brand h3 { margin: 0 0 5px 0; font-size: 16px; font-weight: 700; }
        .footer-brand p { margin: 0; font-size: 13px; color: #666; }
        .social-links {
            display: flex;
            gap: 15px;
        }
        .social-links a {
            color: var(--dark-color);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: color 0.2s;
        }
        .social-links a:hover { color: var(--primary-color); }

        .loading { text-align: center; padding: 50px; font-size: 14px; color: #666; }
    </style>
</head>
<body>

    <header>
        <div class="brand-container">
            <img id="logo-tienda" class="brand-logo" src="" alt="Logo" style="display: none;">
            <h1 id="titulo-tienda">Mi Tienda Online</h1>
        </div>
        <div class="header-actions">
            <button class="btn-carrito" onclick="toggleCart()">
                🛒 Carrito <span id="contador-carrito">0</span>
            </button>
        </div>
    </header>

    <div class="container">
        <div class="hero">
            <h2>Catálogo Disponible</h2>
            <p>Explora nuestros productos, filtra por categoría o busca lo que necesitas</p>
        </div>

        <!-- Barra de Búsqueda y Categorías -->
        <div class="store-controls">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="input-busqueda" placeholder="Buscar productos..." oninput="filtrarProductos()">
            </div>
            <div id="contenedor-categorias" class="categories-container">
                <!-- Los botones de categorías se generan solos -->
            </div>
        </div>

        <div id="contenedor-catalogo" class="loading">
            Cargando productos...
        </div>
    </div>

    <!-- Footer Elegante -->
    <footer>
        <div class="footer-content">
            <div class="footer-brand">
                <h3 id="footer-nombre-tienda">Mi Tienda Online</h3>
                <p>Todos los derechos reservados &copy; 2026</p>
            </div>
            <div class="social-links" id="contenedor-redes">
                <!-- Enlaces de redes sociales automáticos -->
            </div>
        </div>
    </footer>

    <!-- Panel Lateral del Carrito -->
    <div id="cart-overlay" class="cart-overlay" onclick="toggleCart()"></div>
    <div id="cart-drawer" class="cart-drawer">
        <div class="cart-header">
            <h3>Tu Carrito de Compras</h3>
            <button class="btn-cerrar" onclick="toggleCart()">&times;</button>
        </div>
        <div class="cart-body" id="cart-items-container">
            <p style="color: #666; text-align: center; margin-top: 40px;">El carrito está vacío</p>
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Total:</span>
                <span id="cart-total-price">$0.00</span>
            </div>
            <button class="btn-whatsapp" onclick="enviarPedidoWhatsApp()">
                Pedir por WhatsApp 💬
            </button>
        </div>
    </div>

    <script>
        // ==========================================
        // ⚙️ CONFIGURACIÓN DE LA PLANTILLA (CADA CLIENTE)
        // ==========================================
        const CONFIG = {
            SHEET_ID: "1GwO-Nn8mMCgxbn4vQ69dFiEUiAYviDeTOIA0d0glE8A", // Reemplaza con tu ID real
            WHATSAPP_NUMBER: "584249387699",    // Tu número con código de país (sin +)
            STORE_NAME: "EveryONe by ON",    // Nombre del negocio
            LOGO_URL: "https://lh3.googleusercontent.com/d/1d_y7B5OLrkzGpgYtwH8Tg0yzJWw1rpNk",    // URL del logotipo (opcional). Si se coloca, aparecerá junto al título en el centro.
            FAVICON_URL: "https://lh3.googleusercontent.com/d/1d_y7B5OLrkzGpgYtwH8Tg0yzJWw1rpNk",    // URL del ícono de la pestaña del navegador (opcional)
            SOCIAL_LINKS: {
                instagram: "https://instagram.com/everyone.by.on",
                facebook: "https://facebook.com/everyone.by.on",
                tiktok: "https://tiktok.com/@everyone.by.on"
            }
        };

        let carrito = [];
        let productosGlobales = [];
        let categoriaSeleccionada = "Todos";

        const URL_SHEET = `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Productos`;

        // Aplicar datos de configuración en la interfaz al iniciar
        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("titulo-tienda").innerText = CONFIG.STORE_NAME;
            document.getElementById("footer-nombre-tienda").innerText = CONFIG.STORE_NAME;
            document.title = CONFIG.STORE_NAME + " - Catálogo";

            // Configurar Favicon si existe
            if (CONFIG.FAVICON_URL.trim() !== "") {
                const faviconLink = document.querySelector("link[rel*='icon']") || document.createElement('link');
                faviconLink.type = 'image/png';
                faviconLink.rel = 'shortcut icon';
                faviconLink.href = CONFIG.FAVICON_URL;
                document.getElementsByTagName('head')[0].appendChild(faviconLink);
            }

            // Configurar Logotipo central si existe
            const logoEl = document.getElementById("logo-tienda");
            if (CONFIG.LOGO_URL.trim() !== "") {
                logoEl.src = CONFIG.LOGO_URL;
                logoEl.style.display = "block";
            } else {
                logoEl.style.display = "none";
            }

            // Generar enlaces de redes sociales en el footer
            const redesContainer = document.getElementById("contenedor-redes");
            let redesHtml = "";
            if (CONFIG.SOCIAL_LINKS.instagram) redesHtml += `<a href="${CONFIG.SOCIAL_LINKS.instagram}" target="_blank">Instagram</a>`;
            if (CONFIG.SOCIAL_LINKS.facebook) redesHtml += `<a href="${CONFIG.SOCIAL_LINKS.facebook}" target="_blank">Facebook</a>`;
            if (CONFIG.SOCIAL_LINKS.tiktok) redesHtml += `<a href="${CONFIG.SOCIAL_LINKS.tiktok}" target="_blank">TikTok</a>`;
            redesContainer.innerHTML = redesHtml;

            cargarCatalogo();
        });

        async function cargarCatalogo() {
            const contenedor = document.getElementById("contenedor-catalogo");
            try {
                const respuesta = await fetch(URL_SHEET);
                const datosCsv = await respuesta.text();
                const filas = parsearCSV(datosCsv);
                
                if (filas.length <= 1) {
                    contenedor.innerHTML = "<p>No hay productos disponibles.</p>";
                    return;
                }

                const cabeceras = filas[0].map(h => h.trim().toLowerCase());
                const idxNombre = cabeceras.indexOf("nombre");
                const idxDesc = cabeceras.findIndex(h => h.includes("descripción") || h.includes("descripcion"));
                const idxPrecio = cabeceras.indexOf("precio");
                const idxImagen = cabeceras.findIndex(h => h.includes("imagen") || h.includes("url_imagen"));
                const idxEstado = cabeceras.indexOf("estado");
                const idxCategoria = cabeceras.findIndex(h => h.includes("categoría") || h.includes("categoria"));

                productosGlobales = [];

                for (let i = 1; i < filas.length; i++) {
                    const fila = filas[i];
                    if (fila.length < cabeceras.length) continue;

                    const nombre = idxNombre !== -1 ? fila[idxNombre] : "";
                    const descripcion = idxDesc !== -1 ? fila[idxDesc] : "";
                    const precio = idxPrecio !== -1 ? parseFloat(fila[idxPrecio]) || 0 : 0;
                    const imagen = idxImagen !== -1 ? fila[idxImagen] : "";
                    const estado = idxEstado !== -1 ? fila[idxEstado].trim().toLowerCase() : "";
                    const categoria = idxCategoria !== -1 && fila[idxCategoria] ? fila[idxCategoria].trim() : "General";

                    if (estado === "disponible") {
                        productosGlobales.push({ nombre, descripcion, precio, imagen, categoria });
                    }
                }

                generarBotonesCategorias();
                filtrarProductos();

            } catch (error) {
                console.error("Error:", error);
                contenedor.innerHTML = "<p style='color: red;'>Error al conectar con la base de datos. Verifica el ID de tu hoja.</p>";
            }
        }

        function generarBotonesCategorias() {
            const categoriasSet = new Set(["Todos"]);
            productosGlobales.forEach(p => categoriasSet.add(p.categoria));

            const contenedorCat = document.getElementById("contenedor-categorias");
            let htmlCat = "";

            categoriasSet.forEach(cat => {
                let claseActiva = (cat === categoriaSeleccionada) ? "btn-cat active" : "btn-cat";
                htmlCat += `<button class="${claseActiva}" onclick="seleccionarCategoria('${cat}')">${cat}</button>`;
            });

            contenedorCat.innerHTML = htmlCat;
        }

        function seleccionarCategoria(cat) {
            categoriaSeleccionada = cat;
            generarBotonesCategorias();
            filtrarProductos();
        }

        function filtrarProductos() {
            const textoBusqueda = document.getElementById("input-busqueda").value.toLowerCase();
            const contenedor = document.getElementById("contenedor-catalogo");

            const productosFiltrados = productosGlobales.filter(prod => {
                const coincideCat = (categoriaSeleccionada === "Todos" || prod.categoria === categoriaSeleccionada);
                const coincideTexto = prod.nombre.toLowerCase().includes(textoBusqueda) || prod.descripcion.toLowerCase().includes(textoBusqueda);
                return coincideCat && coincideTexto;
            });

            if (productosFiltrados.length === 0) {
                contenedor.innerHTML = "<p style='text-align:center; color:#666;'>No se encontraron productos con esos criterios.</p>";
                return;
            }

            let htmlGrid = '<div class="grid-productos">';

            productosFiltrados.forEach((prod) => {
                const itemEnCarrito = carrito.find(item => item.nombre === prod.nombre);
                const cantidad = itemEnCarrito ? itemEnCarrito.cantidad : 0;
                
                let textoBoton = cantidad > 0 ? `Agregado (${cantidad})` : "Agregar";
                let claseBoton = cantidad > 0 ? "btn-agregar btn-agregado" : "btn-agregar";

                htmlGrid += `
                    <div class="card">
                        <div>
                            <div class="card-img-container">
                                <img src="${prod.imagen}" alt="${prod.nombre}">
                            </div>
                            <h3>${prod.nombre}</h3>
                            <p>${prod.descripcion}</p>
                        </div>
                        <div class="card-footer">
                            <span class="price">$${prod.precio.toFixed(2)}</span>
                            <button class="${claseBoton}" onclick="cambiarCantidad('${prod.nombre.replace(/'/g, "\\'")}', ${prod.precio}, 1)">${textoBoton}</button>
                        </div>
                    </div>
                `;
            });

            htmlGrid += '</div>';
            contenedor.innerHTML = htmlGrid;
        }

        function cambiarCantidad(nombre, precio, delta) {
            const index = carrito.findIndex(item => item.nombre === nombre);

            if (index !== -1) {
                carrito[index].cantidad += delta;
                if (carrito[index].cantidad <= 0) {
                    carrito.splice(index, 1);
                }
            } else if (delta > 0) {
                carrito.push({ nombre, precio, cantidad: 1 });
            }

            actualizarCarritoUI();
            filtrarProductos();

            const contador = document.getElementById("contador-carrito");
            contador.style.transform = "scale(1.3)";
            setTimeout(() => contador.style.transform = "scale(1)", 200);
        }

        function actualizarCarritoUI() {
            const totalPiezas = carrito.reduce((sum, item) => sum + item.cantidad, 0);
            document.getElementById("contador-carrito").innerText = totalPiezas;
            
            const contenedorItems = document.getElementById("cart-items-container");
            const totalPrecioEl = document.getElementById("cart-total-price");

            if (carrito.length === 0) {
                contenedorItems.innerHTML = '<p style="color: #666; text-align: center; margin-top: 40px;">El carrito está vacío</p>';
                totalPrecioEl.innerText = "$0.00";
                return;
            }

            let htmlItems = "";
            let totalGeneral = 0;

            carrito.forEach((item) => {
                const subtotal = item.precio * item.cantidad;
                totalGeneral += subtotal;

                htmlItems += `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <h4>${item.nombre}</h4>
                            <p>$${item.precio.toFixed(2)} x ${item.cantidad} = <strong>$${subtotal.toFixed(2)}</strong></p>
                        </div>
                        <div class="cart-controls">
                            <button class="btn-qty" onclick="cambiarCantidad('${item.nombre.replace(/'/g, "\\'")}', ${item.precio}, -1)">-</button>
                            <span>${item.cantidad}</span>
                            <button class="btn-qty" onclick="cambiarCantidad('${item.nombre.replace(/'/g, "\\'")}', ${item.precio}, 1)">+</button>
                        </div>
                    </div>
                `;
            });

            contenedorItems.innerHTML = htmlItems;
            totalPrecioEl.innerText = `$${totalGeneral.toFixed(2)}`;
        }

        function toggleCart() {
            const drawer = document.getElementById("cart-drawer");
            const overlay = document.getElementById("cart-overlay");
            const isOpen = drawer.classList.toggle("open");
            overlay.style.display = isOpen ? "block" : "none";
        }

        function enviarPedidoWhatsApp() {
            if (carrito.length === 0) {
                alert("Tu carrito está vacío.");
                return;
            }

            let mensaje = "Hola! Quisiera realizar el siguiente pedido:\n\n";
            let totalGeneral = 0;

            carrito.forEach((item, i) => {
                const subtotal = item.precio * item.cantidad;
                totalGeneral += subtotal;
                mensaje += `${i + 1}. ${item.nombre} (Cant: ${item.cantidad}) - Subtotal: $${subtotal.toFixed(2)}\n`;
            });

            mensaje += `\n*Total a pagar: $${totalGeneral.toFixed(2)}*\n\nQuedo atento para coordinar el pago y la entrega.`;

            const urlWhatsApp = `https://wa.me/${CONFIG.WHATSAPP_NUMBER}?text=${encodeURIComponent(mensaje)}`;
            window.open(urlWhatsApp, '_blank');
        }

        function parsearCSV(texto) {
            let lineas = texto.split("\n");
            let resultado = [];
            for (let i = 0; i < lineas.length; i++) {
                let fila = [];
                let enComillas = false;
                let valorActual = "";
                let linea = lineas[i];
                for (let j = 0; j < linea.length; j++) {
                    let char = linea[j];
                    if (char === '"') {
                        enComillas = !enComillas;
                    } else if (char === ',' && !enComillas) {
                        fila.push(valorActual.trim().replace(/^"|"$/g, ''));
                        valorActual = "";
                    } else {
                        valorActual += char;
                    }
                }
                fila.push(valorActual.trim().replace(/^"|"$/g, ''));
                if (fila.length > 1 || fila[0] !== "") {
                    resultado.push(fila);
                }
            }
            return resultado;
        }

        cargarCatalogo();
    </script>
