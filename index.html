<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Productos</title>
    <style>
        :root {
            --primary-color: #4CBB17;
            --dark-color: #111111;
            --gray-light: #f9f9f9;
            --border-color: #eaeaea;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: var(--dark-color);
        }
        header {
            padding: 20px 40px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(5px);
            z-index: 100;
        }
        header h1 {
            font-size: 18px;
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.5px;
        }
        .btn-carrito {
            background-color: var(--dark-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }
        .btn-carrito:hover {
            background-color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .hero {
            margin-bottom: 30px;
        }
        .hero h2 {
            font-size: 26px;
            font-weight: 700;
            margin: 0 0 8px 0;
        }
        .hero p {
            color: #666;
            font-size: 14px;
            margin: 0;
        }
        .grid-productos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 25px;
        }
        .card {
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            background: #fff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.04);
        }
        .card-img-container {
            width: 100%;
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 8px;
            background: var(--gray-light);
            margin-bottom: 15px;
        }
        .card img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .card h3 {
            font-size: 15px;
            font-weight: 600;
            margin: 0 0 6px 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card p {
            font-size: 12px;
            color: #666;
            margin: 0 0 15px 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.4;
        }
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }
        .price {
            font-size: 16px;
            font-weight: 700;
        }
        .btn-agregar {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-agregar:hover {
            background-color: #3fa512;
        }
        .btn-agregado {
            background-color: var(--dark-color);
        }

        /* Estilos del Panel Lateral del Carrito (Drawer) */
        .cart-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(2px);
            display: none;
            z-index: 1000;
        }
        .cart-drawer {
            position: fixed;
            top: 0;
            right: -400px;
            width: 380px;
            max-width: 100%;
            height: 100%;
            background: white;
            box-shadow: -5px 0 25px rgba(0,0,0,0.1);
            z-index: 1001;
            display: flex;
            flex-direction: column;
            transition: right 0.3s ease;
        }
        .cart-drawer.open {
            right: 0;
        }
        .cart-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .cart-header h3 {
            margin: 0;
            font-size: 16px;
        }
        .btn-cerrar {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
        }
        .cart-body {
            padding: 20px;
            flex: 1;
            overflow-y: auto;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }
        .cart-item-info h4 {
            margin: 0 0 4px 0;
            font-size: 13px;
        }
        .cart-item-info p {
            margin: 0;
            font-size: 12px;
            color: #666;
        }
        .cart-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-qty {
            background: #f1f1f1;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-qty:hover {
            background: #e2e2e2;
        }
        .cart-footer {
            padding: 20px;
            border-top: 1px solid var(--border-color);
            background: var(--gray-light);
        }
        .cart-total {
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 15px;
        }
        .btn-whatsapp {
            width: 100%;
            background-color: #25D366;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            transition: background 0.2s;
        }
        .btn-whatsapp:hover {
            background-color: #1ebe57;
        }
        .loading {
            text-align: center;
            padding: 50px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>

    <header>
        <h1>Mi Tienda Online</h1>
        <button class="btn-carrito" onclick="toggleCart()">
            🛒 Carrito <span id="contador-carrito">0</span>
        </button>
    </header>

    <div class="container">
        <div class="hero">
            <h2>Catálogo Disponible</h2>
            <p>Selecciona los productos que deseas y haz tu pedido al instante</p>
        </div>

        <div id="contenedor-catalogo" class="loading">
            Cargando productos...
        </div>
    </div>

    <!-- Panel Lateral del Carrito -->
    <div id="cart-overlay" class="cart-overlay" onclick="toggleCart()"></div>
    <div id="cart-drawer" class="cart-drawer">
        <div class="cart-header">
            <h3>Tu Carrito de Compras</h3>
            <button class="btn-cerrar" onclick="toggleCart()">&times;</button>
        </div>
        <div class="cart-body" id="cart-items-container">
            <p style="color: #666; text-align: center;">El carrito está vacío</p>
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Total:</span>
                <span id="cart-total-price">$0.00</span>
            </div>
            <button class="btn-whatsapp" onclick="enviarPedidoWhatsApp()">
                Pedir por WhatsApp 💬
            </button>
        </div>
    </div>

    <script>
        // ==========================================
        // ⚙️ CONFIGURACIÓN DE LA PLANTILLA (CADA CLIENTE)
        // ==========================================
        const CONFIG = {
            SHEET_ID: "TU_ID_DE_GOOGLE_SHEET", // Reemplaza con tu ID real
            WHATSAPP_NUMBER: "584121234567"     // Tu número con código de país (sin +)
        };

        let carrito = [];
        let productosGlobales = [];

        const URL_SHEET = `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Productos`;

        async function cargarCatalogo() {
            const contenedor = document.getElementById("contenedor-catalogo");
            try {
                const respuesta = await fetch(URL_SHEET);
                const datosCsv = await respuesta.text();
                const filas = parsearCSV(datosCsv);
                
                if (filas.length <= 1) {
                    contenedor.innerHTML = "<p>No hay productos disponibles.</p>";
                    return;
                }

                const cabeceras = filas[0].map(h => h.trim().toLowerCase());
                const idxNombre = cabeceras.indexOf("nombre");
                const idxDesc = cabeceras.findIndex(h => h.includes("descripción") || h.includes("descripcion"));
                const idxPrecio = cabeceras.indexOf("precio");
                const idxImagen = cabeceras.findIndex(h => h.includes("imagen") || h.includes("url_imagen"));
                const idxEstado = cabeceras.indexOf("estado");

                productosGlobales = [];

                for (let i = 1; i < filas.length; i++) {
                    const fila = filas[i];
                    if (fila.length < cabeceras.length) continue;

                    const nombre = idxNombre !== -1 ? fila[idxNombre] : "";
                    const descripcion = idxDesc !== -1 ? fila[idxDesc] : "";
                    const precio = idxPrecio !== -1 ? parseFloat(fila[idxPrecio]) || 0 : 0;
                    const imagen = idxImagen !== -1 ? fila[idxImagen] : "";
                    const estado = idxEstado !== -1 ? fila[idxEstado].trim().toLowerCase() : "";

                    if (estado === "disponible") {
                        productosGlobales.push({ nombre, descripcion, precio, imagen });
                    }
                }

                renderizarCatalogo();

            } catch (error) {
                console.error("Error:", error);
                contenedor.innerHTML = "<p style='color: red;'>Error al conectar con la base de datos. Verifica el ID de tu hoja.</p>";
            }
        }

        function renderizarCatalogo() {
            const contenedor = document.getElementById("contenedor-catalogo");
            if (productosGlobales.length === 0) {
                contenedor.innerHTML = "<p style='text-align:center;'>No hay productos disponibles.</p>";
                return;
            }

            let htmlGrid = '<div class="grid-productos">';

            productosGlobales.forEach((prod, index) => {
                // Ver si el producto ya está en el carrito para mostrar su cantidad en el botón
                const itemEnCarrito = carrito.find(item => item.nombre === prod.nombre);
                const cantidad = itemEnCarrito ? itemEnCarrito.cantidad : 0;
                
                let textoBoton = cantidad > 0 ? `Agregado (${cantidad})` : "Agregar";
                let claseBoton = cantidad > 0 ? "btn-agregar btn-agregado" : "btn-agregar";

                htmlGrid += `
                    <div class="card">
                        <div>
                            <div class="card-img-container">
                                <img src="${prod.imagen}" alt="${prod.nombre}">
                            </div>
                            <h3>${prod.nombre}</h3>
                            <p>${prod.descripcion}</p>
                        </div>
                        <div class="card-footer">
                            <span class="price">$${prod.precio.toFixed(2)}</span>
                            <button class="${claseBoton}" onclick="cambiarCantidad('${prod.nombre.replace(/'/g, "\\'")}', ${prod.precio}, 1)">${textoBoton}</button>
                        </div>
                    </div>
                `;
            });

            htmlGrid += '</div>';
            contenedor.innerHTML = htmlGrid;
        }

        function cambiarCantidad(nombre, precio, delta) {
            const index = carrito.findIndex(item => item.nombre === nombre);

            if (index !== -1) {
                carrito[index].cantidad += delta;
                if (carrito[index].cantidad <= 0) {
                    carrito.splice(index, 1); // Lo elimina si llega a 0
                }
            } else if (delta > 0) {
                carrito.push({ nombre, precio, cantidad: 1 });
            }

            actualizarCarritoUI();
            renderizarCatalogo(); // Actualiza los textos de los botones en la pantalla

            // Animación sutil en el contador del carrito
            const contador = document.getElementById("contador-carrito");
            contador.style.transform = "scale(1.3)";
            setTimeout(() => contador.style.transform = "scale(1)", 200);
        }

        function actualizarCarritoUI() {
            // Calcular total de piezas en el carrito
            const totalPiezas = carrito.reduce((sum, item) => sum + item.cantidad, 0);
            document.getElementById("contador-carrito").innerText = totalPiezas;
            
            const contenedorItems = document.getElementById("cart-items-container");
            const totalPrecioEl = document.getElementById("cart-total-price");

            if (carrito.length === 0) {
                contenedorItems.innerHTML = '<p style="color: #666; text-align: center; margin-top: 40px;">El carrito está vacío</p>';
                totalPrecioEl.innerText = "$0.00";
                return;
            }

            let htmlItems = "";
            let totalGeneral = 0;

            carrito.forEach((item) => {
                const subtotal = item.precio * item.cantidad;
                totalGeneral += subtotal;

                htmlItems += `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <h4>${item.nombre}</h4>
                            <p>$${item.precio.toFixed(2)} x ${item.cantidad} = <strong>$${subtotal.toFixed(2)}</strong></p>
                        </div>
                        <div class="cart-controls">
                            <button class="btn-qty" onclick="cambiarCantidad('${item.nombre.replace(/'/g, "\\'")}', ${item.precio}, -1)">-</button>
                            <span>${item.cantidad}</span>
                            <button class="btn-qty" onclick="cambiarCantidad('${item.nombre.replace(/'/g, "\\'")}', ${item.precio}, 1)">+</button>
                        </div>
                    </div>
                `;
            });

            contenedorItems.innerHTML = htmlItems;
            totalPrecioEl.innerText = `$${totalGeneral.toFixed(2)}`;
        }

        function toggleCart() {
            const drawer = document.getElementById("cart-drawer");
            const overlay = document.getElementById("cart-overlay");
            const isOpen = drawer.classList.toggle("open");
            overlay.style.display = isOpen ? "block" : "none";
        }

        function enviarPedidoWhatsApp() {
            if (carrito.length === 0) {
                alert("Tu carrito está vacío.");
                return;
            }

            let mensaje = "Hola! Quisiera realizar el siguiente pedido:\n\n";
            let totalGeneral = 0;

            carrito.forEach((item, i) => {
                const subtotal = item.precio * item.cantidad;
                totalGeneral += subtotal;
                mensaje += `${i + 1}. ${item.nombre} (Cant: ${item.cantidad}) - Subtotal: $${subtotal.toFixed(2)}\n`;
            });

            mensaje += `\n*Total a pagar: $${totalGeneral.toFixed(2)}*\n\nQuedo atento para coordinar el pago y la entrega.`;

            const urlWhatsApp = `https://wa.me/${CONFIG.WHATSAPP_NUMBER}?text=${encodeURIComponent(mensaje)}`;
            window.open(urlWhatsApp, '_blank');
        }

        function parsearCSV(texto) {
            let lineas = texto.split("\n");
            let resultado = [];
            for (let i = 0; i < lineas.length; i++) {
                let fila = [];
                let enComillas = false;
                let valorActual = "";
                let linea = lineas[i];
                for (let j = 0; j < linea.length; j++) {
                    let char = linea[j];
                    if (char === '"') {
                        enComillas = !enComillas;
                    } else if (char === ',' && !enComillas) {
                        fila.push(valorActual.trim().replace(/^"|"$/g, ''));
                        valorActual = "";
                    } else {
                        valorActual += char;
                    }
                }
                fila.push(valorActual.trim().replace(/^"|"$/g, ''));
                if (fila.length > 1 || fila[0] !== "") {
                    resultado.push(fila);
                }
            }
            return resultado;
        }

        cargarCatalogo();
    </script>
</body>
</html>
